# Releases trustbeat-signature on a version tag (vX.Y.Z): static binaries for Linux, macOS and
# Windows (amd64 + arm64) in archives with their licence texts, SHA256SUMS, and a Sigstore
# signature of SHA256SUMS.
#
# This workflow lives at the root of TrustBeat/trustbeat-signature (mirrored from eu-security-app
# signature-extractor/). It does NOT run in the monorepo — GitHub only executes workflows at the
# repository root — so the first tag is its first real run.
#
# Signing is keyless (cosign + GitHub OIDC): the certificate names this workflow and the tag, so
# there is no TrustBeat signing key to store or lose. Customers check it with
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/TrustBeat/trustbeat-signature/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never interrupt a half-finished release

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.27.3'  # = the toolchain line of go.mod (checked below)
          cache: false          # no cache in a release build

      - name: Vet and format
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod)"
          [ "$(go env GOVERSION)" = "$want" ] || { echo "::error::Go $(go env GOVERSION), go.mod pins $want"; exit 1; }
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Test against the DSS oracle
        run: go test -count=1 ./...

      - name: Build release archives
        run: ./build.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload assets
      id-token: write  # keyless cosign signature of SHA256SUMS
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - name: Check archives against SHA256SUMS
        run: cd dist && sha256sum --check --strict SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SHA256SUMS
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "trustbeat-signature $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*

      # Dogfood: a qualified timestamp over the exact archives just released. Evidence only — it
      # must never turn a completed release red.
      - name: Anchor release artifacts (TrustBeat)
        continue-on-error: true
        uses: TrustBeat/anchor-action@a5eb4451717f36d7bd1b6142a473003031f27512  # v1.0.0
        with:
          api-key: ${{ secrets.TRUSTBEAT_API_KEY }}
          files: dist/*
          description: "trustbeat-signature ${{ github.ref_name }}"

  # ghcr.io/trustbeat/trustbeat-signature, packed from the archives just released.
  docker:
    name: Container image
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ github.ref_name }}
